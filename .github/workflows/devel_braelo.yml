name: Build and deploy Django app to Azure Web App - braelo

on:
  push:
    branches:
      - devel
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DJANGO_ENV: development
      DEBUG: "true"
      SECRET_KEY: ci-only-not-for-production
      DJANGO_SKIP_MONGOENGINE: "1"
      BRAELO_RATE_LIMIT_BACKEND: memory
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit and API tests
        run: python manage.py test --verbosity=2

      - name: Compile smoke script
        run: python -m py_compile scripts/smoke_test.py

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect static files
        run: python manage.py collectstatic --noinput
        env:
          CI: "true"
          DJANGO_ENV: development
          DEBUG: "true"
          SECRET_KEY: ci-only-not-for-production
          DJANGO_SKIP_MONGOENGINE: "1"

      - name: Zip project for deployment
        run: zip -r release.zip . -x "venv/*" ".git/*" "__pycache__/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact
        run: unzip release.zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Do NOT migrate here: CI has no WEBSITE_SITE_NAME, so SQLite would be repo-local
      # and not the production file under /home/data. Migrations run in startup.sh on Azure.

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "Braelo-V1"
          package: .
          # Oryx extracts the app to /tmp/…; only an archive stays under wwwroot. Use a
          # relative path so the script runs from the extracted app root (same dir as manage.py).
          startup-command: "bash startup.sh"
