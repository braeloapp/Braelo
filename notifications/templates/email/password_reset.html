{% extends "email/base.html" %}
{% block content %}
  <p>Hi {{ name|default:"there" }},</p>
  <p>Use this code to reset your Braelo password:</p>
  <p style="font-size:28px;font-weight:bold;letter-spacing:4px;color:#111111;">{{ otp }}</p>
  <p>This code expires in {{ ttl_minutes }} minutes. If you did not request a reset, you can ignore this email.</p>
{% endblock %}
